# Default values for cyberpower-pdu-mqtt-bridge
# See https://github.com/willysamz/cyberpower-pdu-mqtt-bridge for documentation

replicaCount: 1

image:
  repository: ghcr.io/willysamz/cyberpower-pdu-mqtt-bridge
  pullPolicy: IfNotPresent
  # Defaults to appVersion from Chart.yaml if not set
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- PDU / SNMP target ---
pdu:
  # REQUIRED: the address of your CyberPower PDU
  host: "192.0.2.1"
  port: "161"
  community: "public"
  snmpVersion: "2c"
  timeout: "5.0"
  retries: "1"
  # SNMP write community (typically "private" on CyberPower; check
  # Configuration -> Security -> SNMPv1 in the PDU's web UI). When set,
  # the chart wraps it in a Secret. Required for outlet control.
  writeCommunity: ""
  # SNMP version to use for write operations. "v2c" works on most modern
  # CyberPower firmware; override to "v1" only if the agent rejects v2c sets.
  snmpWriteVersion: "v2c"

# --- Polling cadence ---
poll:
  intervalSeconds: "15"

# --- Mains voltage assumption used to derive watts (PDU may not expose voltage reliably) ---
mainsVoltage: "120.0"

# --- MQTT broker ---
mqtt:
  host: "mqtt"
  port: "1883"
  clientId: "cyberpower-pdu-mqtt-bridge"
  topicPrefix: "pdu"
  keepalive: "60"
  qos: "0"
  # If your broker requires authentication, populate username + password.
  # The chart auto-creates a Secret with the password when set.
  username: ""
  password: ""

# --- Home Assistant MQTT discovery ---
ha:
  discoveryEnabled: "true"
  discoveryPrefix: "homeassistant"
  deviceName: "CyberPower PDU"
  # Stable device id. Blank → derived from SNMP sysName at first poll.
  deviceId: ""

# --- Outlet control (v0.2+) ---
control:
  # Master switch. False is the safe default — incoming MQTT commands and
  # REST writes are rejected. Set to "true" only after you've confirmed the
  # SNMP write community has Read/Write access in the PDU's UI.
  enabled: "false"
  # CSV of outlet numbers permitted to be actuated when enabled. Empty
  # string = all outlets allowed. Use "8" (or similar) for the first
  # production test to limit the blast radius to a single safe outlet.
  allow: ""

# --- Logging ---
logging:
  level: INFO
  json: true

service:
  type: ClusterIP
  port: 8080

nodeSelector: {}
tolerations: []
affinity: {}

# Pod security context
podSecurityContext: {}

# Container security context (no special privileges needed)
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 25m
    memory: 64Mi

extraEnv: []

podAnnotations: {}
podLabels: {}
