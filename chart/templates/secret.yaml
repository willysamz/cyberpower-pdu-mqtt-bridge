{{- if or .Values.mqtt.password .Values.pdu.writeCommunity -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cyberpower-pdu-mqtt-bridge.fullname" . }}
  labels:
    {{- include "cyberpower-pdu-mqtt-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.mqtt.password }}
  MQTT_USERNAME: {{ .Values.mqtt.username | quote }}
  MQTT_PASSWORD: {{ .Values.mqtt.password | quote }}
  {{- end }}
  {{- if .Values.pdu.writeCommunity }}
  PDU_WRITE_COMMUNITY: {{ .Values.pdu.writeCommunity | quote }}
  {{- end }}
{{- end }}
